    descricao: Horários de nascer e pôr do sol para qualquer coordenada
    docs: https://sunrise-sunset.org/api
    autenticacao: nenhuma
    exemplo: https://api.sunrise-sunset.org/json?lat=-23.55&lng=-46.63

  - nome: USGS Terremotos
    categoria: internacional
    descricao: Abalos sísmicos registrados no Brasil e na América do Sul
    docs: https://earthquake.usgs.gov/fdsnws/event/1/
    autenticacao: nenhuma
    exemplo: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minlatitude=-34&maxlatitude=6&minlongitude=-74&maxlongitude=-34&limit=1

  - nome: Internet Archive
    categoria: livros
    descricao: Busca no acervo digital do Internet Archive, com livros, áudios e vídeos em português
    docs: https://archive.org/developers/
    autenticacao: nenhuma
    exemplo: https://archive.org/advancedsearch.php?q=language%3Apor&fl%5B%5D=identifier&rows=1&output=json

  - nome: CoinPaprika
    categoria: internacional
    descricao: Cotações de criptomoedas convertidas para reais
    docs: https://api.coinpaprika.com
    autenticacao: nenhuma
    exemplo: https://api.coinpaprika.com/v1/tickers/btc-bitcoin?quotes=BRL

  - nome: Banco Mundial Projetos
    categoria: internacional
    descricao: Projetos financiados pelo Banco Mundial no Brasil
    docs: https://projects.worldbank.org/en/projects-operations/projects-home
    autenticacao: nenhuma
    exemplo: https://search.worldbank.org/api/v2/projects?format=json&countrycode_exact=BR&rows=1

  - nome: Open Topo Data
    categoria: internacional
    descricao: Altitude por coordenada a partir de modelos de relevo como o SRTM
    docs: https://www.opentopodata.org
    autenticacao: nenhuma
    limite: 1 req/s e 1.000 por dia
    exemplo: https://api.opentopodata.org/v1/srtm90m?locations=-22.95,-43.21

  - nome: QR Server
    categoria: utilidades
    descricao: Geração de QR Codes, útil para códigos Pix copia e cola
    docs: https://goqr.me/api/
    autenticacao: nenhuma
    exemplo: https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=apis-publicas-brasil

  - nome: IP-API
    categoria: utilidades
    descricao: Localização aproximada por IP, com nomes de cidades e estados em português
    docs: https://ip-api.com/docs
    autenticacao: nenhuma
    limite: 45 req/min, uso não comercial
    exemplo: http://ip-api.com/json/?lang=pt-BR
